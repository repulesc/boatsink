name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check the script (LSL-PyOptimizer)
        run: bash tools/lslcheck.sh
      - name: Install Pillow (the animation preview is drawn with it)
        run: python3 -m pip install --quiet pillow
      - name: Simulate the motion maths and check the animation files
        run: |
          for t in tools/sim/*.py; do
            [ -e "$t" ] || continue
            echo "== $t"
            python3 "$t"
          done
